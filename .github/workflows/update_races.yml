name: ⚙️ Automatic Race Data Update

on:
  schedule:
    # Runs every day at 04:00 UTC (perfect for fetching fresh data in the morning)
    - cron: '0 4 * * *'
  # Allows the update to be triggered manually with a single click
  workflow_dispatch: 

permissions:
  # Essential to allow the Action to write/commit changes to the repository
  contents: write 

jobs:
  build_and_update:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the repository code
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      # 2. Configure Python (stable version)
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install dependencies
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas beautifulsoup4 lxml html5lib

      # 4. Generate CSV from the JSON source (optional, but good practice)
      - name: 💾 Generate data/gare.csv
        run: python scripts/generate_csv.py

      # 5. Generate and inject the table into the README
      - name: 📊 Build README Dashboard
        run: python scripts/build_readme.py

      # 6. Commit changes (if any were made)
      - name: 💾 Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Bot: Automatic running race data update [skip ci]"
          file_pattern: 'data/*.json data/*.csv README.md'
          repository: .